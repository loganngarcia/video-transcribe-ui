name: Publish interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Configure public reader address
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: python -c 'import json,os,pathlib; pathlib.Path("web/config.js").write_text("window.CAMERA_CONFIG = " + json.dumps({"apiBase":os.environ.get("API_BASE_URL", "")}) + ";\n")'
      - run: npm run build
      - name: Include runtime configuration
        run: cp web/config.js dist/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
