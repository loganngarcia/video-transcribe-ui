name: Build browser USR model
on:
  push:
    branches: [main]
    paths:
      - scripts/export_browser_model.py
      - .github/workflows/browser-model.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h
      - name: Install exporter
        run: |
          python -m pip install --upgrade pip
          pip install gdown==6.2.0 six==1.17.0 onnx==1.18.0 onnxruntime==1.22.1 onnxconverter-common==1.16.0
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Export official Base+ graph
        run: python scripts/export_browser_model.py --output browser-model
      - name: Show model payload
        run: |
          du -h browser-model/*
          cat browser-model/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: usr2-browser-model
          path: browser-model/
          retention-days: 7
      - name: Publish browser model chunks
        run: |
          rm -rf web/public/model
          mkdir -p web/public/model
          cp browser-model/* web/public/model/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/model
          git diff --cached --quiet && exit 0
          git commit -m "Add browser USR 2.0 Base+ model"
          git push
