name: Browser VSR smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-smoke.yml
      - scripts/browser_smoke.mjs
      - web/local-vsr.js
      - web/public/model/manifest.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build production site
        run: npm run build
      - name: Include runtime configuration\n        run: cp web/config.js dist/config.js\n      - name: Download real visual-speech sample
        run: curl -fL --retry 3 https://raw.githubusercontent.com/Sindhu-Hegde/multivsr/master/samples/GBfc471SoSo-00000.mp4 -o browser-smoke.mp4
      - name: Serve production build
        run: |
          python -m http.server 4173 --bind 127.0.0.1 -d dist >/tmp/camera-site.log 2>&1 &
          echo $! >/tmp/camera-site.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/camera-site.log
          exit 1
      - name: Transcribe real clip entirely in browser
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node scripts/browser_smoke.mjs browser-smoke.mp4
      - if: always()
        name: Show server log
        run: cat /tmp/camera-site.log || true
